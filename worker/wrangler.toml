name = "jlpt-n3-sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Created with:  npx wrangler kv namespace create STATE
# Paste the returned id below, then:  npx wrangler deploy
[[kv_namespaces]]
binding = "STATE"
id = "054953a395ef43fd851b62c6c3b653e2"

[vars]
# Optional. Comma-separated origins allowed to call the API. Leave empty to
# accept any origin — the payload is encrypted and the id is unguessable, so
# this is mainly belt-and-braces.
ALLOWED_ORIGINS = ""
