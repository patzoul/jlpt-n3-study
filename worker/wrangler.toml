name = "jlpt-n3-sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Created with:  npx wrangler kv namespace create STATE
#
# The id that command returns is specific to your Cloudflare account, so it does
# not belong in a public repo. Copy this file to wrangler.local.toml (gitignored),
# put the real id there, and deploy with:
#
#   npx wrangler deploy -c wrangler.local.toml
#
# See README.md.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Optional. Comma-separated origins allowed to call the API. Leave empty to
# accept any origin — the payload is encrypted and the id is unguessable, so
# this is mainly belt-and-braces.
ALLOWED_ORIGINS = ""
