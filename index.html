<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JLPT N3 Study</title>
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Spaced-repetition study for the JLPT N3 syllabus." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">JLPT N3</p>
          <h1>Study</h1>
        </div>
        <span id="levelBadge" class="level-badge">Level 1</span>
      </header>

      <nav class="tabs" aria-label="Sections">
        <a class="tab active" data-view="dashboard" href="#dashboard">Dashboard</a>
        <a class="tab" data-view="lessons" href="#lessons">Lessons</a>
        <a class="tab" data-view="reviews" href="#reviews">Reviews</a>
        <a class="tab" data-view="browse" href="#browse">Browse</a>
        <a class="tab" data-view="stats" href="#stats">Progress</a>
        <a class="tab" data-view="settings" href="#settings">Settings</a>
      </nav>

      <main id="view">
        <section class="card"><p class="muted">Loading decks…</p></section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
      // Service workers need a secure context; skip it on plain-http hosts so
      // local development over http://<lan-ip> still loads.
      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((error) => {
            console.warn('Offline support unavailable.', error);
          });
        });
      }
    </script>
  </body>
</html>
